<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc9b"/><stop offset="1" stop-color="#9b7434"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140a0c"/><stop offset="1" stop-color="#0a0607"/></linearGradient>
    <style>
      .h{font-family:Georgia,serif;font-size:13px;letter-spacing:6px;fill:#b9a57a}
      .n{font-family:Georgia,serif;font-size:17px;fill:url(#gold)}
      .k{font-family:Georgia,serif;font-style:italic;font-size:11px;fill:#a24555}
      .card{animation:in .8s ease-out both}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .ring{fill:none;stroke:#c6a15b;stroke-width:1.2;stroke-dasharray:3 4;animation:spin 14s linear infinite}
      @keyframes spin{to{stroke-dashoffset:-140}}
    </style>
  </defs>
  <rect width="900" height="250" rx="6" fill="#070506"/>
  <rect x="6" y="6" width="888" height="238" rx="4" fill="none" stroke="#c6a15b" stroke-opacity=".3"/>
  <text x="450" y="36" text-anchor="middle" class="h">— SPELLS INSCRIBED —</text>

  <!-- each card: x offset, icon glyph, name, attribute -->
  <g class="card" style="animation-delay:.1s" transform="translate(30 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#8b1e2d" stroke-opacity=".7"/>
    <circle class="ring" cx="66" cy="58" r="34"/>
    <text x="66" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#e6c77a">py</text>
    <text x="66" y="122" text-anchor="middle" class="n">Python</text>
    <text x="66" y="142" text-anchor="middle" class="k">serpent magic</text>
  </g>
  <g class="card" style="animation-delay:.3s" transform="translate(172 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#8b1e2d" stroke-opacity=".7"/>
    <circle class="ring" cx="66" cy="58" r="34"/>
    <text x="66" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#e6c77a">C#</text>
    <text x="66" y="122" text-anchor="middle" class="n">C#</text>
    <text x="66" y="142" text-anchor="middle" class="k">steel magic</text>
  </g>
  <g class="card" style="animation-delay:.5s" transform="translate(314 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#8b1e2d" stroke-opacity=".7"/>
    <circle class="ring" cx="66" cy="58" r="34"/>
    <text x="66" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#e6c77a">TS</text>
    <text x="66" y="122" text-anchor="middle" class="n">TypeScript</text>
    <text x="66" y="142" text-anchor="middle" class="k">binding magic</text>
  </g>
  <g class="card" style="animation-delay:.7s" transform="translate(456 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#8b1e2d" stroke-opacity=".7"/>
    <circle class="ring" cx="66" cy="58" r="34"/>
    <text x="66" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#e6c77a">&lt;/&gt;</text>
    <text x="66" y="122" text-anchor="middle" class="n">HTML</text>
    <text x="66" y="142" text-anchor="middle" class="k">creation magic</text>
  </g>
  <g class="card" style="animation-delay:.9s" transform="translate(598 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#8b1e2d" stroke-opacity=".7"/>
    <circle class="ring" cx="66" cy="58" r="34"/>
    <text x="66" y="66" text-anchor="middle" font-family="Consolas,monospace" font-size="22" fill="#e6c77a">{ }</text>
    <text x="66" y="122" text-anchor="middle" class="n">CSS</text>
    <text x="66" y="142" text-anchor="middle" class="k">illusion magic</text>
  </g>
  <g class="card" style="animation-delay:1.1s" transform="translate(740 58)">
    <rect width="132" height="160" rx="4" fill="url(#page)" stroke="#c4364a"/>
    <circle class="ring" cx="66" cy="58" r="34" style="stroke:#c4364a"/>
    <g transform="translate(66 58)" fill="none" stroke="#e6c77a" stroke-width="2"><circle cx="-10" cy="-12" r="4"/><circle cx="-10" cy="14" r="4"/><circle cx="12" cy="0" r="4"/><path d="M-10 -8 V10 M-10 -4 C -10 0 8 0 9 -2"/></g>
    <text x="66" y="122" text-anchor="middle" class="n">Git</text>
    <text x="66" y="142" text-anchor="middle" class="k">time magic</text>
  </g>
</svg>
