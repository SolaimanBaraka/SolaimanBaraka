<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1c0b10"/>
      <stop offset="0.55" stop-color="#0b0709"/>
      <stop offset="1" stop-color="#050405"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc9b"/>
      <stop offset="0.5" stop-color="#c6a15b"/>
      <stop offset="1" stop-color="#7d5a22"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1016"/>
      <stop offset="1" stop-color="#0d0507"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .rune { fill:none; stroke:#c6a15b; stroke-width:1; opacity:.35 }
      .spin { transform-origin:180px 150px; animation:spin 60s linear infinite }
      .spinr { transform-origin:180px 150px; animation:spin 40s linear infinite reverse }
      @keyframes spin { to { transform:rotate(360deg) } }
      .pulse { animation:pulse 3.2s ease-in-out infinite }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
      .crack { stroke-dasharray:260; stroke-dashoffset:260; animation:crack 6s ease-in-out infinite }
      @keyframes crack { 0%,15%{stroke-dashoffset:260;opacity:0} 30%{opacity:1} 55%,80%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
      .mote { animation:rise 7s linear infinite; opacity:0 }
      @keyframes rise { 0%{transform:translateY(0);opacity:0} 15%{opacity:.9} 100%{transform:translateY(-140px);opacity:0} }
      .title { font-family:Georgia,'Times New Roman',serif; font-size:52px; letter-spacing:4px; fill:url(#gold) }
      .sub { font-family:Georgia,'Times New Roman',serif; font-size:15px; letter-spacing:6px; fill:#b9a57a }
      .quote { font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:15px; fill:#c4364a }
    </style>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- border frame -->
  <rect x="10" y="10" width="880" height="280" fill="none" stroke="#c6a15b" stroke-opacity=".35"/>
  <rect x="16" y="16" width="868" height="268" fill="none" stroke="#8b1e2d" stroke-opacity=".5"/>
  <g fill="#c6a15b" opacity=".7">
    <path d="M10 10 l14 0 l-14 14z"/><path d="M890 10 l-14 0 l14 14z"/>
    <path d="M10 290 l14 0 l-14 -14z"/><path d="M890 290 l-14 0 l14 -14z"/>
  </g>

  <!-- magic circle behind grimoire -->
  <circle cx="180" cy="150" r="118" fill="#8b1e2d" opacity=".18" filter="url(#soft)"/>
  <g class="spin">
    <circle class="rune" cx="180" cy="150" r="118"/>
    <circle class="rune" cx="180" cy="150" r="106" stroke-dasharray="2 6"/>
    <g class="rune" style="opacity:.5">
      <path d="M180 32 L282 209 L78 209 Z"/>
      <path d="M180 268 L78 91 L282 91 Z"/>
    </g>
  </g>
  <g class="spinr">
    <circle class="rune" cx="180" cy="150" r="92" stroke-dasharray="14 4 2 4"/>
    <g fill="none" stroke="#c6a15b" stroke-width="1.1" opacity=".6"><path transform="translate(180.0 52.0)" d="M-4 5V-5M-4 -5L4 -1M-4 0L4 3"/><path transform="translate(249.3 80.7)" d="M0 -5L4 0L0 5L-4 0Z M-4 5L4 -5"/><path transform="translate(278.0 150.0)" d="M-3 5V-5L3 -2L-3 1L3 5"/><path transform="translate(249.3 219.3)" d="M-4 -5L4 5M4 -5L-4 5M-4 0H4"/><path transform="translate(180.0 248.0)" d="M0 5V-5M0 -1L-4 -5M0 -1L4 -5"/><path transform="translate(110.7 219.3)" d="M-3 5V-5L3 -1L-3 3"/><path transform="translate(82.0 150.0)" d="M-4 5V-5L0 0L4 -5V5"/><path transform="translate(110.7 80.7)" d="M0 5V-5M-4 -1L0 -5L4 -1"/></g>
  </g>

  <!-- grimoire -->
  <g transform="translate(180 150)">
    <rect x="-52" y="-66" width="104" height="132" rx="5" fill="#070405"/>
    <rect x="-48" y="-64" width="98" height="128" rx="4" fill="url(#cover)" stroke="#c6a15b" stroke-width="1.5"/>
    <rect x="-40" y="-56" width="82" height="112" rx="2" fill="none" stroke="#c6a15b" stroke-opacity=".45"/>
    <rect x="-48" y="-64" width="10" height="128" fill="#140709" stroke="#c6a15b" stroke-opacity=".5"/>
    <!-- five-leaf emblem -->
    <g class="pulse" filter="url(#glow)" fill="none" stroke="#e6c77a" stroke-width="1.6">
      <g transform="translate(5 -4)">
        <path id="leaf" d="M0 0 C -10 -8 -12 -22 0 -26 C 12 -22 10 -8 0 0Z"/>
        <use href="#leaf" transform="rotate(72)"/>
        <use href="#leaf" transform="rotate(144)"/>
        <use href="#leaf" transform="rotate(216)"/>
        <use href="#leaf" transform="rotate(288)"/>
        <circle r="3" fill="#8b1e2d" stroke="none"/>
      </g>
    </g>
    <!-- anti-magic cracks -->
    <g fill="none" stroke="#c4364a" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)">
      <path class="crack" d="M50 -40 L30 -30 L36 -12 L14 0 L24 16 L4 30 L12 48 L-6 62"/>
      <path class="crack" style="animation-delay:.4s" d="M36 -12 L56 -2 M24 16 L44 26 M12 48 L30 58"/>
    </g>
  </g>

  <!-- floating motes -->
  <g fill="#e6c77a">
    <circle class="mote" cx="120" cy="250" r="1.6"/>
    <circle class="mote" style="animation-delay:1.5s" cx="230" cy="260" r="1.2"/>
    <circle class="mote" style="animation-delay:3s" cx="160" cy="255" r="1"/>
    <circle class="mote" style="animation-delay:4.5s" cx="260" cy="250" r="1.4"/>
    <circle class="mote" style="animation-delay:2.2s;fill:#c4364a" cx="90" cy="245" r="1.3"/>
    <circle class="mote" style="animation-delay:5.5s;fill:#c4364a" cx="200" cy="262" r="1.1"/>
  </g>

  <!-- text block -->
  <text x="340" y="96" class="sub">THE GRIMOIRE OF</text>
  <text x="336" y="152" class="title">SOLAIMAN</text>
  <text x="336" y="204" class="title">BARAKA</text>
  <line x1="340" y1="224" x2="860" y2="224" stroke="url(#gold)" stroke-opacity=".6"/>
  <path d="M600 224 l6 -5 l6 5 l-6 5z" fill="#8b1e2d" stroke="#c6a15b"/>
  <text x="340" y="252" class="sub" style="font-size:12px;letter-spacing:4px">FULL STACK · IN PROGRESS · DAW</text>
  <text x="860" y="252" class="quote" text-anchor="end">“I do not quit.”</text>
</svg>
